<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Sugestão de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="main">
        <h1>Sistema de Sugestão de Filmes</h1>

        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h4>Perfil do Usuário</h4>
                    </div>
                    <div class="card-body">
                        <form id="userForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="userSelect" class="form-label">Selecionar Usuário</label>
                                    <select class="form-select" id="userSelect">
                                        <option value="">-- Selecione um usuário --</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="userAge" class="form-label">Idade</label>
                                    <input type="number" class="form-control" id="userAge" disabled>
                                </div>
                            </div>
                        </form>

                        <div id="pastFavoritesContainer" class="mt-4">
                            <h5>Filmes Favoritados</h5>
                            <div id="pastFavoritesList" class="row"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h4>Treinamento do Modelo</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="model-controls d-flex gap-2">
                                <button id="trainModelBtn" class="btn btn-primary train-model-btn">
                                    <i class="bi bi-cpu"></i> Treinar Modelo
                                </button>
                                <button disabled id="runRecommendationBtn" class="btn btn-success train-model-btn">
                                    <i class="bi bi-cpu"></i> Gerar Recomendação
                                </button>
                            </div>
                        </div>


                        <div class="all-users-purchases">
                            <h5 id="favoritesDiv" style="cursor: pointer;">
                                Favoritos de Todos os Usuários
                                <i id="favoritesArrow" class="bi bi-chevron-down"></i>
                            </h5>
                            <div id="allUsersFavoritesList" class="user-purchases-data overflow-auto"
                                style="max-height: 400px;display: none;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="">Filmes</h3>
        <div class="row" id="movieList">
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@1.5.1/dist/tfjs-vis.umd.min.js"></script>
    <script type="module" src="./src/index.js"></script>
</body>

</html>
