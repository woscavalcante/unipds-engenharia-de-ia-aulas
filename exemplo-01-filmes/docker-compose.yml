services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filmes
      POSTGRES_USER: filmes
      POSTGRES_PASSWORD: filmes
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmes -d filmes"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: ./seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://filmes:filmes@db:5432/filmes
    volumes:
      - ./data/kaggle/movies:/data:ro
    restart: "no"

  api:
    build: ./api
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://filmes:filmes@db:5432/filmes
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./src:/usr/share/nginx/html/src:ro

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  db_data:
